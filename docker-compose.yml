# Run with: docker compose up --build

name: asd2026-group40

# AI-Mode, MCP and RAG run as host processes via scripts/run-ai-services.sh.
# Containers reach them through host.docker.internal; the host-gateway mapping
# also supports Linux. Ollama remains in Compose for model management.
x-ai-env: &ai-env
  OLLAMA_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
  AI_MODE_URL: ${AI_MODE_URL:-http://host.docker.internal:7001}
  MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:7002}
  RAG_SERVER_URL: ${RAG_SERVER_URL:-http://host.docker.internal:7003}

x-extra-hosts: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ======================= TEAM / SHARED SERVICES ==========================

  # Unified home page (index.html) linking every student's frontend feature.
  shared-home:
    image: nginx:1.27-alpine
    container_name: asd-shared-home
    ports:
      - "3000:80"
    volumes:
      - ./shared:/usr/share/nginx/html:ro
    networks: [asd-net]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: asd-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: asd-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'echo "Pulling $${LLM_MODEL} ..." && ollama pull "$${LLM_MODEL}" && ollama list'
    networks: [asd-net]
    restart: "no"

  # Start the host AI services after Ollama is ready:
  # bash scripts/run-ai-services.sh

  # =================== STUDENT 1 - Ronaldo Kwan ============================
  # Feature: Product Catalogue

  student-1-db:
    build: ./student-1/database
    container_name: asd-student-1-db
    environment:
      DB_PATH: /data/products.db
      SERVICE_PORT: "9001"
    ports:
      - "9001:9001"
    volumes:
      - student-1-data:/data
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  student-1-backend:
    build: ./student-1/backend
    container_name: asd-student-1-backend
    environment:
      <<: *ai-env
      DATABASE_URL: http://student-1-db:9001
      SERVICE_PORT: "8001"
      AI_MODE_ENABLED: ${AI_MODE_ENABLED:-true}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      MCP_TIMEOUT: ${MCP_TIMEOUT:-15}
      RAG_TIMEOUT: ${RAG_TIMEOUT:-120}
    ports:
      - "8001:8001"
    depends_on:
      student-1-db:
        condition: service_healthy
    <<: *host-gateway
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  student-1-frontend:
    build: ./student-1/frontend
    container_name: asd-student-1-frontend
    environment:
      BACKEND_URL: http://student-1-backend:8001
      HOME_URL: http://localhost:3000
      SERVICE_PORT: "3001"
      MCP_TIMEOUT: ${MCP_TIMEOUT:-15}
      RAG_TIMEOUT: ${RAG_TIMEOUT:-120}
    ports:
      - "3001:3001"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      student-1-backend:
        condition: service_started
    networks: [asd-net]
    restart: unless-stopped

  # =================== STUDENT 2 - Jinying Li ==============================
  # Feature: Customer Orders. Ports 3002 / 8002 / 9002.

  student2-db:
    build:
      context: ./student-2
      dockerfile: database-api/Dockerfile
    container_name: asd-student2-db
    environment:
      SERVER_PORT: "9002"
      DATABASE_URL: jdbc:sqlite:/data/orders.db
    ports:
      - "9002:9002"
    volumes:
      - student2-orders-data:/data
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  student2-api:
    build:
      context: ./student-2
      dockerfile: backend/Dockerfile
    container_name: asd-student2-api
    environment:
      <<: *ai-env
      SERVER_PORT: "8002"
      DATABASE_API_URL: http://student2-db:9002
      PRODUCT_API_URL: http://student-1-backend:8001
      STOCK_API_URL: http://student-4-backend:8004
      AI_MODE_ENABLED: ${AI_MODE_ENABLED:-true}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
    ports:
      - "8002:8002"
    depends_on:
      student2-db:
        condition: service_healthy
    <<: *host-gateway
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  student2-frontend:
    build:
      context: ./student-2
      dockerfile: frontend/Dockerfile
    container_name: asd-student2-frontend
    environment:
      SERVER_PORT: "3002"
      BACKEND_URL: http://student2-api:8002
    ports:
      - "3002:3002"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      student2-api:
        condition: service_healthy
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # =================== STUDENT 3 - Vishvak A. Rameshkumar ==================
  # Feature: Customer Account Management. Ports 3003 / 8003 / 9003.

  student-3-db:
    build: ./student-3/database
    container_name: asd-student-3-db
    environment:
      DB_PATH: /data/customers.db
      SERVICE_PORT: "9003"
    ports:
      - "9003:9003"
    volumes:
      - student-3-data:/data
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  student-3-backend:
    build: ./student-3/backend
    container_name: asd-student-3-backend
    environment:
      <<: *ai-env
      DATABASE_URL: http://student-3-db:9003
      SERVICE_PORT: "8003"
      AI_MODE_ENABLED: ${AI_MODE_ENABLED:-true}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      MCP_TIMEOUT: ${MCP_TIMEOUT:-15}
      RAG_TIMEOUT: ${RAG_TIMEOUT:-120}
    ports:
      - "8003:8003"
    depends_on:
      student-3-db:
        condition: service_healthy
    <<: *host-gateway
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 10s

  student-3-frontend:
    build: ./student-3/frontend
    container_name: asd-student-3-frontend
    environment:
      BACKEND_URL: http://student-3-backend:8003
      HOME_URL: http://localhost:3000
      SERVICE_PORT: "3003"
    ports:
      - "3003:3003"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      student-3-backend:
        condition: service_healthy
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:3003/health')"]
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 10s

  # =================== STUDENT 4 - Jonathan Czesler ========================
  # Feature: Inventory and Stock. Ports 3004 / 8004 / 9004

  student-4-db:
    build: ./student-4/database
    container_name: asd-student-4-db
    environment:
      DB_PATH: /data/stock.db
      SERVICE_PORT: "9004"
    ports:
      - "9004:9004"
    volumes:
      - student-4-data:/data
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9004/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  student-4-backend:
    build: ./student-4/backend
    container_name: asd-student-4-backend
    environment:
      <<: *ai-env
      DATABASE_URL: http://student-4-db:9004
      SERVICE_PORT: "8004"
      AI_MODE_ENABLED: ${AI_MODE_ENABLED:-true}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      MCP_TIMEOUT: ${MCP_TIMEOUT:-15}
      RAG_TIMEOUT: ${RAG_TIMEOUT:-120}
    ports:
      - "8004:8004"
    depends_on:
      student-4-db:
        condition: service_healthy
    <<: *host-gateway
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  student-4-frontend:
    build: ./student-4/frontend
    container_name: asd-student-4-frontend
    environment:
      BACKEND_URL: http://student-4-backend:8004
      HOME_URL: http://localhost:3000
      SERVICE_PORT: "3004"
    ports:
      - "3004:3004"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      student-4-backend:
        condition: service_started
    networks: [asd-net]
    restart: unless-stopped

  # =================== STUDENT 5 - Alexander McGuinn =======================
  # Feature: Reviews and Ratings

  student-5-db:
    build: ./student-5/database
    container_name: asd-student-5-db
    environment:
      DB_PATH: /data/reviews.db
      SERVICE_PORT: "9005"
    ports:
      - "9005:9005"
    volumes:
      - student-5-data:/data
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9005/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  student-5-backend:
    build: ./student-5/backend
    container_name: asd-student-5-backend
    environment:
      <<: *ai-env
      DATABASE_URL: http://student-5-db:9005
      CATALOGUE_URL: http://student-1-backend:8001
      SERVICE_PORT: "8005"
    ports:
      - "8005:8005"
    <<: *host-gateway
    depends_on:
      student-5-db:
        condition: service_healthy
      student-1-backend:
        condition: service_started
    networks: [asd-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  student-5-frontend:
    build: ./student-5/frontend
    container_name: asd-student-5-frontend
    environment:
      BACKEND_URL: http://student-5-backend:8005
      HOME_URL: http://localhost:3000
      SERVICE_PORT: "3005"
    ports:
      - "3005:3005"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      student-5-backend:
        condition: service_started
    networks: [asd-net]
    restart: unless-stopped

networks:
  asd-net:
    driver: bridge

volumes:
  ollama-data:
  student-1-data:
  student2-orders-data:
  student-3-data:
  student-4-data:
  student-5-data:
