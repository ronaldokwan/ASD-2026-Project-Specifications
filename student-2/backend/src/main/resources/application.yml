server:
  port: ${SERVER_PORT:5202}

spring:
  application:
    name: student2-backend

services:
  database-api-url: ${DATABASE_API_URL:http://localhost:5203}
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  ollama-model: ${OLLAMA_MODEL:qwen2.5:3b}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
