server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: student2-backend

services:
  database-api-url: ${DATABASE_API_URL:http://localhost:9002}
  product-api-url: ${PRODUCT_API_URL:http://localhost:8001}
  stock-api-url: ${STOCK_API_URL:http://localhost:8004}
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  ai-mode-url: ${AI_MODE_URL:http://localhost:7001}
  ollama-model: ${OLLAMA_MODEL:qwen2.5:3b}
  mcp-server-url: ${MCP_SERVER_URL:http://localhost:7002}
  rag-server-url: ${RAG_SERVER_URL:http://localhost:7003}
  mcp-enabled: ${MCP_ENABLED:true}
  rag-enabled: ${RAG_ENABLED:true}
  mcp-timeout-seconds: ${MCP_TIMEOUT:15}
  rag-timeout-seconds: ${RAG_TIMEOUT:120}

app:
  seed-orders: ${SEED_ORDERS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
