services:
  student2-db:
    build:
      context: .
      dockerfile: database-api/Dockerfile
    environment:
      SERVER_PORT: 5203
      DATABASE_URL: jdbc:sqlite:/data/orders.db
    ports:
      - "5203:5203"
    volumes:
      - student2-orders-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5203/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  student2-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_PORT: 5202
      DATABASE_API_URL: http://student2-db:5203
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "5202:5202"
    depends_on:
      student2-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5202/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  student2-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SERVER_PORT: 5201
      BACKEND_URL: http://student2-api:5202
    ports:
      - "5201:5201"
    depends_on:
      student2-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5201/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  student2-orders-data:
