services:
  student2-db:
    build:
      context: .
      dockerfile: database-api/Dockerfile
    environment:
      SERVER_PORT: 9002
      DATABASE_URL: jdbc:sqlite:/data/orders.db
    ports:
      - "9002:9002"
    volumes:
      - student2-orders-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  student2-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_PORT: 8002
      DATABASE_API_URL: http://student2-db:9002
      PRODUCT_API_URL: ${PRODUCT_API_URL:-http://host.docker.internal:8001}
      STOCK_API_URL: ${STOCK_API_URL:-http://host.docker.internal:8004}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "8002:8002"
    depends_on:
      student2-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  student2-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SERVER_PORT: 3002
      BACKEND_URL: http://student2-api:8002
    ports:
      - "3002:3002"
    depends_on:
      student2-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  student2-orders-data:
