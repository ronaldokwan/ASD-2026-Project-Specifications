# ===========================================================================
# Student 5 - Alexander McGuinn - Reviews and Ratings
# lint -> unit tests -> Docker build -> container smoke test
# ===========================================================================
name: student-5

on:
  push:
    branches: ["**"]
    paths:
      - "student-5/**"
      - "ai-services/ai-mode/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5.yml"
  pull_request:
    paths:
      - "student-5/**"
      - "ai-services/ai-mode/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # -------------------------------------------------------------------------
  test:
    name: Unit tests (frontend, backend/API, database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-5/database/requirements.txt
          pip install -r student-5/backend/requirements.txt
          pip install -r student-5/frontend/requirements.txt
          pip install -r ai-services/ai-mode/requirements.txt
          pip install -r ai-services/mcp-server/requirements.txt
          pip install -r ai-services/rag-server/requirements.txt
          pip install flake8

      - name: Lint (syntax errors and undefined names fail the build)
        run: |
          flake8 student-5 ai-services/ai-mode ai-services/mcp-server ai-services/rag-server \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 student-5 ai-services/ai-mode ai-services/mcp-server ai-services/rag-server \
            --count --max-line-length=100 --exit-zero --statistics

      - name: Student 5 microservice tests
        run: pytest student-5/tests -v --junitxml=reports/student-5-tests.xml

      - name: Shared agentic loop tests (AI-Mode)
        run: pytest ai-services/ai-mode/tests -v --junitxml=reports/ai-mode-tests.xml

      - name: Shared MCP server tests
        run: pytest ai-services/mcp-server/tests -v --junitxml=reports/mcp-server-tests.xml

      - name: Shared RAG server tests
        run: pytest ai-services/rag-server/tests -v --junitxml=reports/rag-server-tests.xml

      - name: Upload test evidence for the technical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-test-reports
          path: reports/

  # -------------------------------------------------------------------------
  docker:
    name: Build containers and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Build the three Student 5 images
        run: |
          docker build -t asd/student-5-db:ci       student-5/database
          docker build -t asd/student-5-backend:ci  student-5/backend
          docker build -t asd/student-5-frontend:ci student-5/frontend

      - name: Start the Student 5 stack
        # --no-deps keeps the multi-gigabyte Ollama image and the Product
        # Catalogue stack out of CI; the AI path is covered by the stubbed
        # AI-Mode/MCP/RAG tests in the job above. AI-Mode, the shared MCP
        # server and the shared RAG server are not containerised (Release 1)
        # and are not started here either, so every AI-backed endpoint must
        # degrade gracefully (see the smoke-test step below), and the
        # catalogue lookup degrades to the raw SKU when unreachable (see
        # backend/app/catalogue_client.py).
        run: |
          cp .env.example .env
          docker compose up -d --build --no-deps \
            student-5-db student-5-backend student-5-frontend

      - name: Wait for all three microservices
        # Every container publishes its port before gunicorn is accepting, so a
        # bare connect succeeds and the proxy then resets it (curl exit 56).
        # Poll each endpoint until it actually answers before smoke testing.
        run: |
          wait_for() {
            name=$1; url=$2; svc=$3
            for i in $(seq 1 45); do
              if curl -fs "$url" > /dev/null; then
                echo "$name is ready after ${i} attempt(s)"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready at $url"
            docker compose ps
            docker compose logs --no-color --tail=100 "$svc"
            return 1
          }
          wait_for "database microservice"    http://localhost:9005/health student-5-db
          wait_for "backend/API microservice" http://localhost:8005/health student-5-backend
          wait_for "frontend microservice"    http://localhost:3005/       student-5-frontend

      - name: Smoke test the CRUD path through the API
        run: |
          set -e
          curl -fs http://localhost:9005/health | tee /dev/stderr | grep -q '"status": *"ok"'
          curl -fs http://localhost:8005/health > /dev/null
          test "$(curl -fs http://localhost:8005/api/reviews | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["reviews"]))')" -ge 10

          created=$(curl -fs -X POST http://localhost:8005/api/reviews \
            -H 'Content-Type: application/json' \
            -d '{"product_sku":"SKU-CI-0001","user_id":"ci-runner","rating":4,"review":"Created by GitHub Actions."}')
          echo "$created"
          id=$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["review_id"])')

          curl -fs -X PUT "http://localhost:8005/api/reviews/$id" \
            -H 'Content-Type: application/json' -d '{"rating": 2}' | grep -q '"rating": *2'
          curl -fs -X DELETE "http://localhost:8005/api/reviews/$id" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8005/api/reviews/$id)" = "404"

      - name: Smoke test graceful degradation (AI-Mode, MCP, RAG disabled in CI)
        # Release 1: none of the three shared AI services run in this job (no
        # ollama-sized images, no native host processes). Both new endpoints
        # must fail soft (503 from our own error handler) rather than 500.
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8005/api/reviews/ask \
            -H 'Content-Type: application/json' \
            -d '{"product_sku":"SKU-AUD-1001","question":"How is the battery life?"}')
          test "$code" = "503"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8005/api/reviews/moderate \
            -H 'Content-Type: application/json' \
            -d '{"product_sku":"SKU-AUD-1001","review_text":"Great product overall.","rating":5}')
          test "$code" = "503"

      - name: Smoke test the frontend microservice
        run: |
          curl -fs http://localhost:3005/ | grep -q "Reviews and Ratings"
          curl -fs http://localhost:3005/partials/reviews | grep -q "review-table"

      - name: Container logs (evidence on failure)
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
