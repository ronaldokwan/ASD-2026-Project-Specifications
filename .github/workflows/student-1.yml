# ===========================================================================
# Student 1 - Ronaldo Kwan - Product Catalogue
# lint -> unit tests -> Docker build -> container smoke test
# ===========================================================================
name: student-1

on:
  push:
    branches: ["**"]
    paths:
      - "student-1/**"
      - "ai-services/ai-mode/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "ai-services/ai-mode/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/student-1.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # -------------------------------------------------------------------------
  test:
    name: Unit tests (frontend, backend/API, database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-1/database/requirements.txt
          pip install -r student-1/backend/requirements.txt
          pip install -r student-1/frontend/requirements.txt
          pip install -r ai-services/ai-mode/requirements.txt
          pip install flake8

      - name: Lint (syntax errors and undefined names fail the build)
        run: |
          flake8 student-1 ai-services/ai-mode \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 student-1 ai-services/ai-mode \
            --count --max-line-length=100 --exit-zero --statistics

      - name: Student 1 microservice tests
        run: pytest student-1/tests -v --junitxml=reports/student-1-tests.xml

      - name: Shared agentic loop tests (AI-Mode)
        run: pytest ai-services/ai-mode/tests -v --junitxml=reports/ai-mode-tests.xml

      - name: Upload test evidence for the technical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-1-test-reports
          path: reports/

  # -------------------------------------------------------------------------
  docker:
    name: Build containers and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Build the three Student 1 images
        run: |
          docker build -t asd/student-1-db:ci       student-1/database
          docker build -t asd/student-1-backend:ci  student-1/backend
          docker build -t asd/student-1-frontend:ci student-1/frontend

      - name: Start the Student 1 stack
        # --no-deps keeps the multi-gigabyte Ollama image out of CI; the AI path
        # is covered by the stubbed AI-Mode tests in the job above.
        run: |
          cp .env.example .env
          docker compose up -d --build --no-deps \
            student-1-db student-1-backend student-1-frontend

      - name: Wait for the database microservice
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9001/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "database microservice did not become healthy"; exit 1

      - name: Smoke test the CRUD path through the API
        run: |
          set -e
          curl -fs http://localhost:9001/health | tee /dev/stderr | grep -q '"status": *"ok"'
          curl -fs http://localhost:8001/health > /dev/null
          test "$(curl -fs http://localhost:8001/api/products | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["products"]))')" -ge 10

          created=$(curl -fs -X POST http://localhost:8001/api/products \
            -H 'Content-Type: application/json' \
            -d '{"sku":"SKU-CI-0001","name":"CI Smoke Product","category":"Audio","price":19.99,"description":"Created by GitHub Actions."}')
          echo "$created"
          id=$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          curl -fs -X PUT "http://localhost:8001/api/products/$id" \
            -H 'Content-Type: application/json' -d '{"price": 24.99}' | grep -q '24.99'
          curl -fs -X DELETE "http://localhost:8001/api/products/$id" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/api/products/$id)" = "404"

      - name: Smoke test the frontend microservice
        run: |
          curl -fs http://localhost:3001/ | grep -q "Product Catalogue"
          curl -fs http://localhost:3001/partials/products | grep -q "product-table"

      - name: Container logs (evidence on failure)
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
