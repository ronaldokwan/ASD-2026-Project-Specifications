name: student-3

on:
  push:
    branches: ["**"]
    paths:
      - "student-3/**"
      - "ai-services/ai-mode/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/student-3.yml"
  pull_request:
    paths:
      - "student-3/**"
      - "ai-services/ai-mode/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/student-3.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Unit tests (frontend, backend/API, database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-3/database/requirements.txt
          pip install -r student-3/backend/requirements.txt
          pip install -r student-3/frontend/requirements.txt
          pip install flake8
      - name: Lint
        run: |
          flake8 student-3 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 student-3 --count --max-line-length=100 --exit-zero --statistics
      - name: Student 3 tests
        run: pytest student-3/tests -v --junitxml=reports/student-3-tests.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-test-reports
          path: reports/

  docker:
    name: Build containers and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared Compose configuration
        run: docker compose config --quiet
      - name: Build Student 3 images
        run: |
          docker build -t asd/student-3-db:ci student-3/database
          docker build -t asd/student-3-backend:ci student-3/backend
          docker build -t asd/student-3-frontend:ci student-3/frontend
      - name: Start Student 3 services without Ollama
        run: |
          cp .env.example .env
          docker compose up -d --build --no-deps \
            student-3-db student-3-backend student-3-frontend
      - name: Wait for services
        run: |
          wait_for() {
            name=$1; url=$2; service=$3
            for attempt in $(seq 1 45); do
              if curl -fs "$url" >/dev/null; then return 0; fi
              sleep 2
            done
            echo "::error::$name did not become ready"
            docker compose logs --no-color --tail=100 "$service"
            return 1
          }
          wait_for "database" http://localhost:9003/health student-3-db
          wait_for "backend" http://localhost:8003/health student-3-backend
          wait_for "frontend" http://localhost:3003/health student-3-frontend
      - name: Smoke test customer CRUD and UI
        run: |
          set -e
          test "$(curl -fs http://localhost:8003/api/customers | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["customers"]))')" -ge 10
          created=$(curl -fs -X POST http://localhost:8003/api/customers \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Customer","email":"ci.customer@example.test","loyalty_tier":"Bronze","joined_at":"2026-09-03"}')
          id=$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fs -X PUT "http://localhost:8003/api/customers/$id" \
            -H 'Content-Type: application/json' -d '{"loyalty_tier":"Silver"}' | grep -q Silver
          curl -fs -X DELETE "http://localhost:8003/api/customers/$id" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8003/api/customers/$id")" = "404"
          curl -fs http://localhost:3003/ | grep -q "Customer Account Management"
          curl -fs http://localhost:3003/partials/customers | grep -q 'id="customer-table"'
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
