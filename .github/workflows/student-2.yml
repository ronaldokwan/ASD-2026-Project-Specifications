name: Student 2 Orders CI

on:
  push:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"
  pull_request:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"

jobs:
  build-test-and-validate-containers:
    runs-on: ubuntu-latest
    env:
      AI_MODE_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
    defaults:
      run:
        working-directory: student-2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test two Student 2 backend endpoint functions
        run: >-
          mvn --batch-mode --projects backend
          --define test=OrderEndpointTests test

      - name: Build and test all modules
        run: mvn --batch-mode clean verify

      - name: Upload Student 2 endpoint test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-2-r2-endpoint-test-results
          path: student-2/backend/target/surefire-reports/TEST-*OrderEndpointTests.xml
          if-no-files-found: error
          retention-days: 30

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build the three service images
        run: docker compose build

      - name: Start and health-check the integrated slice
        run: |
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3002/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v
