name: Student 2 Orders CI

on:
  push:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"
  pull_request:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"

jobs:
  build-test-and-validate-containers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all modules
        run: mvn --batch-mode clean verify

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build the three service images
        run: docker compose build

      - name: Start and health-check the integrated slice
        run: |
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3002/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v
