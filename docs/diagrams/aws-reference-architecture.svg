<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .n{fill:#fff;stroke:#333;stroke-width:1.4}
      .fe{fill:#eaf2fb;stroke:#2c5a94;stroke-width:1.4}
      .be{fill:#eef7ee;stroke:#2f7d4a;stroke-width:1.4}
      .db{fill:#fdf3e6;stroke:#b06d12;stroke-width:1.4}
      .svc{fill:#f6f0fb;stroke:#6b3fa0;stroke-width:1.4}
      .t{font-size:14px;font-weight:600;fill:#111;text-anchor:middle}
      .s{font-size:12px;fill:#444;text-anchor:middle}
      .band{font-size:14px;font-weight:600}
      .lbl{font-size:12px;fill:#222}
      .e{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <!-- Outside AWS -->
  <rect class="n" x="20" y="125" width="170" height="70" rx="8"/>
  <text class="t" x="105" y="155">Users (browser)</text>
  <text class="s" x="105" y="175">HTTP :80, :3001–:3005</text>
  <rect class="n" x="20" y="615" width="170" height="80" rx="8"/>
  <text class="t" x="105" y="645">GitHub Actions</text>
  <text class="s" x="105" y="664">cloud-deployment.yml</text>
  <text class="s" x="105" y="681">(OIDC, no stored keys)</text>

  <!-- AWS -->
  <rect x="215" y="15" width="1170" height="740" rx="12" fill="#fafafa" stroke="#e08a00" stroke-width="2"/>
  <text x="232" y="38" class="band" fill="#b36b00">AWS · ap-southeast-2</text>

  <!-- VPC -->
  <rect x="235" y="50" width="870" height="670" rx="10" fill="#ffffff" stroke="#6b8e23" stroke-width="1.6"/>
  <text x="250" y="72" class="band" fill="#4d6b12">VPC 10.40.0.0/16 · 2 availability zones</text>

  <rect x="255" y="85" width="830" height="115" rx="8" fill="#f1f7e8" stroke="#9bbb59" stroke-dasharray="5 4"/>
  <text x="270" y="104" class="lbl" font-weight="600" fill="#4d6b12">Public subnets ×2</text>
  <rect class="n" x="300" y="115" width="740" height="70" rx="8"/>
  <text class="t" x="670" y="143">Application Load Balancer (internet-facing)</text>
  <text class="s" x="670" y="164">listeners :80 home · :3001–:3005 frontends · security group allows only these ports</text>
  <path class="e" d="M190,160 L298,160"/>

  <rect x="255" y="215" width="830" height="490" rx="8" fill="#f5f8fc" stroke="#7f9cc4" stroke-dasharray="5 4"/>
  <text x="270" y="234" class="lbl" font-weight="600" fill="#2c5a94">Private subnets ×2 · ECS Fargate cluster, 16 services, no public IP</text>

  <!-- frontends -->
  <rect class="fe" x="280" y="255" width="120" height="56" rx="7"/><text class="t" x="340" y="278">shared-home</text><text class="s" x="340" y="296">nginx :80</text>
  <rect class="fe" x="415" y="255" width="120" height="56" rx="7"/><text class="t" x="475" y="278">S1 frontend</text><text class="s" x="475" y="296">:3001</text>
  <rect class="fe" x="550" y="255" width="120" height="56" rx="7"/><text class="t" x="610" y="278">S2 frontend</text><text class="s" x="610" y="296">:3002</text>
  <rect class="fe" x="685" y="255" width="120" height="56" rx="7"/><text class="t" x="745" y="278">S3 frontend</text><text class="s" x="745" y="296">:3003</text>
  <rect class="fe" x="820" y="255" width="120" height="56" rx="7"/><text class="t" x="880" y="278">S4 frontend</text><text class="s" x="880" y="296">:3004</text>
  <rect class="fe" x="955" y="255" width="120" height="56" rx="7"/><text class="t" x="1015" y="278">S5 frontend</text><text class="s" x="1015" y="296">:3005</text>
  <path class="e" d="M670,185 L670,253"/>
  <text class="lbl" x="678" y="205">target groups</text>

  <!-- backends -->
  <rect class="be" x="415" y="355" width="120" height="56" rx="7"/><text class="t" x="475" y="378">S1 backend</text><text class="s" x="475" y="396">:8001</text>
  <rect class="be" x="550" y="355" width="120" height="56" rx="7"/><text class="t" x="610" y="378">S2 backend</text><text class="s" x="610" y="396">:8002</text>
  <rect class="be" x="685" y="355" width="120" height="56" rx="7"/><text class="t" x="745" y="378">S3 backend</text><text class="s" x="745" y="396">:8003</text>
  <rect class="be" x="820" y="355" width="120" height="56" rx="7"/><text class="t" x="880" y="378">S4 backend</text><text class="s" x="880" y="396">:8004</text>
  <rect class="be" x="955" y="355" width="120" height="56" rx="7"/><text class="t" x="1015" y="378">S5 backend</text><text class="s" x="1015" y="396">:8005</text>

  <!-- databases -->
  <rect class="db" x="415" y="455" width="120" height="56" rx="7"/><text class="t" x="475" y="478">S1 database</text><text class="s" x="475" y="496">:9001 SQLite</text>
  <rect class="db" x="550" y="455" width="120" height="56" rx="7"/><text class="t" x="610" y="478">S2 database</text><text class="s" x="610" y="496">:9002 SQLite</text>
  <rect class="db" x="685" y="455" width="120" height="56" rx="7"/><text class="t" x="745" y="478">S3 database</text><text class="s" x="745" y="496">:9003 SQLite</text>
  <rect class="db" x="820" y="455" width="120" height="56" rx="7"/><text class="t" x="880" y="478">S4 database</text><text class="s" x="880" y="496">:9004 SQLite</text>
  <rect class="db" x="955" y="455" width="120" height="56" rx="7"/><text class="t" x="1015" y="478">S5 database</text><text class="s" x="1015" y="496">:9005 SQLite</text>

  <path class="e" d="M475,311 L475,353"/><path class="e" d="M610,311 L610,353"/><path class="e" d="M745,311 L745,353"/><path class="e" d="M880,311 L880,353"/><path class="e" d="M1015,311 L1015,353"/>
  <path class="e" d="M475,411 L475,453"/><path class="e" d="M610,411 L610,453"/><path class="e" d="M745,411 L745,453"/><path class="e" d="M880,411 L880,453"/><path class="e" d="M1015,411 L1015,453"/>
  <text class="lbl" x="290" y="338">REST over Cloud Map</text>
  <text class="lbl" x="290" y="354">private DNS asd.internal</text>
  <text class="lbl" x="290" y="438">one task per</text>
  <text class="lbl" x="290" y="454">SQLite writer</text>

  <rect x="415" y="545" width="660" height="50" rx="7" fill="#fff" stroke="#999" stroke-dasharray="6 4"/>
  <text class="t" x="745" y="566">AI-Mode · MCP · RAG · Multi-Agent: disabled by default</text>
  <text class="s" x="745" y="584">backends run with AI_MODE_ENABLED, MCP_ENABLED, RAG_ENABLED, MULTI_AGENT_ENABLED = false</text>

  <rect x="280" y="615" width="795" height="70" rx="7" fill="#fff" stroke="#bbb"/>
  <text class="t" x="677" y="642">No NAT gateway: images from ECR and logs to CloudWatch go through private VPC endpoints</text>
  <text class="s" x="677" y="662">tasks security group: traffic only from the ALB and between application tasks</text>

  <!-- AWS managed services -->
  <rect class="svc" x="1130" y="60" width="235" height="78" rx="8"/>
  <text class="t" x="1247" y="88">Amazon ECR</text>
  <text class="s" x="1247" y="107">16 repositories, immutable tags,</text>
  <text class="s" x="1247" y="123">scan on push, AES256</text>
  <rect class="svc" x="1130" y="155" width="235" height="62" rx="8"/>
  <text class="t" x="1247" y="182">CloudWatch Logs</text>
  <text class="s" x="1247" y="201">one log group per service</text>
  <rect class="svc" x="1130" y="300" width="235" height="78" rx="8"/>
  <text class="t" x="1247" y="328">S3 Terraform state</text>
  <text class="s" x="1247" y="347">encrypted, versioned,</text>
  <text class="s" x="1247" y="363">TLS-only, public access blocked</text>
  <rect class="svc" x="1130" y="445" width="235" height="78" rx="8"/>
  <text class="t" x="1247" y="473">Amazon EFS (encrypted)</text>
  <text class="s" x="1247" y="492">access point per database,</text>
  <text class="s" x="1247" y="508">TLS in transit</text>
  <path class="e" d="M1075,483 L1128,483"/>
  <rect class="svc" x="1130" y="615" width="235" height="78" rx="8"/>
  <text class="t" x="1247" y="643">IAM deploy role</text>
  <text class="s" x="1247" y="662">GitHub OIDC, environment</text>
  <text class="s" x="1247" y="678">aws-production only</text>

  <path class="e" d="M190,665 L205,665 L205,742 L1247,742 L1247,695"/>
  <text class="lbl" x="560" y="736">AssumeRoleWithWebIdentity → Terraform apply, image push, ECS rollout</text>
</svg>
