<div class="customer-detail">
  <h3>{{ customer.name }}</h3>
  <dl>
    <dt>Email</dt><dd>{{ customer.email }}</dd>
    <dt>Phone</dt><dd>{{ customer.phone or '—' }}</dd>
    <dt>Address</dt><dd>{{ customer.address or '—' }}</dd>
    <dt>Loyalty tier</dt><dd>{{ customer.loyalty_tier }}</dd>
    <dt>Joined</dt><dd>{{ customer.joined_at }}</dd>
  </dl>
  <button class="btn secondary" hx-post="/customers/{{ customer.id }}/mcp-profile"
          hx-target="#mcp-panel" hx-disabled-elt="this">
    Check Profile with MCP
  </button>
  <button class="btn ai" hx-post="/customers/{{ customer.id }}/multi-agent"
          hx-target="#multi-agent-panel" hx-disabled-elt="this">
    Review loyalty recommendation
  </button>
</div>
<div class="result-panel" hx-get="/customers/{{ customer.id }}/multi-agent/history"
     hx-trigger="load, every 15s" hx-swap="innerHTML"></div>
